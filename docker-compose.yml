name: jatin-activity-tracker

services:
  db:
    image: postgres:16-alpine
    container_name: prep-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prep_tracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: prep-tracker-app
    restart: unless-stopped
    env_file: .env.local
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/prep_tracker?sslmode=require"
      NEXTAUTH_URL: "http://localhost:3000"
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  pgdata:
